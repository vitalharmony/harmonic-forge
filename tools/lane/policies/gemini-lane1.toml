# Admin-tier policy for a Gemini Lane 1 (Blueprint) session (harmonic-forge#362).
#
# Loaded via `--admin-policy`, the only mechanism proven live (harmonic-forge#326)
# to survive `--yolo` and remove denied tools from the model's own tool list
# entirely, rather than merely refusing them at call time.
#
# Shape, verified live against the installed Gemini CLI 0.56.0 bundle before
# writing this file (not asserted from documentation):
# - Rules are matched highest-`priority`-wins, first-match
#   (`packages/core/dist/src/policy/engine.js`'s `PolicyEngine.check()`:
#   `this.rules.sort((a,b) => (b.priority ?? 0) - (a.priority ?? 0))`, then a
#   plain `for` loop over the sorted list acting on the first match). There is
#   no "deny always wins" special case -- allow and deny compete on priority
#   alone. Every rule in this file is loaded at the Admin tier regardless of
#   whether it came from this launcher-injected file or a passthrough
#   `--admin-policy` value (both land in the same `adminPolicyPaths` set,
#   `packages/core/dist/src/policy/config.js`'s `getPolicyTier()`) -- see the
#   harmonic-forge#322 dependency note below.
# - `priority` must be an integer in [0, 999] (schema-enforced; values >= 1000
#   would jump to the next tier). The catch-all deny below MUST be the floor
#   (lowest priority in this file) precisely because it is a `toolName = "*"`
#   match that would otherwise win every tie against a more specific rule.
# - `run_shell_command` rules use `commandPrefix` (a literal string prefix,
#   or array of prefixes) rather than a raw `argsPattern` regex where a
#   simple prefix is sufficient and unambiguous -- confirmed as a first-class,
#   purpose-built field for exactly this ("`commandPrefix`/`commandRegex` can
#   only be used with `toolName = "run_shell_command"`", the loader's own
#   validation message).
#
# Threat model (harmonic-forge#362 DJC #2): Lane 1 is advisory and never
# implements (role boundary, universal-lane1.md) -- it authors handoffs,
# reviews Lane 2's diffs, and posts protocol comments through the sanctioned
# wrappers. It has no legitimate need for file writes (already denied below),
# destructive git operations, package installs, or arbitrary code execution
# (`python -c`, `sh -c`, heredoc indirection). #362 concluded from this that a
# blanket deny would make Lane 1 unable to do its job, and shipped a narrow
# enumerated allowlist instead. **That conclusion was correct about the cost
# and wrong about the alternative** (harmonic-forge#412): the narrow allowlist
# permitted arbitrary local code execution, so the choice was never
# "capability vs. safety" -- it was "capability vs. the appearance of safety."
# Lane 1 now has no shell, and loses its posting channel with it; see the deny
# rule below for the accepted cost and its intended replacement.
#
# ANSWERED, in the negative (harmonic-forge#412): an earlier version of this
# header flagged the `commandPrefix`/`commandRegex` matching semantics as not
# yet live-verified end-to-end. They have since been verified live, and the
# allowlist they supported did not hold -- see the `run_shell_command` deny
# below for the three escape classes and why no pattern closes them. The
# canary suite (`tools/lane/policies/canary/`) now carries all three as
# regression probes asserted on filesystem/process ground truth.

# Default-deny base (harmonic-forge#362 REFORGE decision 2): a new CLI
# release, MCP tool, or extension is denied by default, not silently
# permitted by omission from an enumerated allow list.
[[rule]]
toolName = "*"
decision = "deny"
priority = 0
denyMessage = "harmonic-forge#362: default-deny admin-tier base -- this tool is not on Lane 1's explicit allow list."

# Whole-tool global denies -- the only property the 0.56.0 engine actually
# proved live (harmonic-forge#326): the tool is absent from the model's own
# tool list, not merely refused at call time.
[[rule]]
toolName = ["write_file", "replace"]
decision = "deny"
priority = 999
denyMessage = "harmonic-forge#362: Lane 1 never edits files -- role boundary, universal-lane1.md."

[[rule]]
toolName = ["activate_skill", "invoke_agent"]
decision = "deny"
priority = 999
denyMessage = "harmonic-forge#362: Lane 1 does not spawn nested skills/agents outside the standard 3-lane loop."

# `run_shell_command` is denied WHOLE-TOOL (harmonic-forge#412).
#
# The narrow, argument-constrained allowlist that stood here was not a
# boundary. Verified live against Gemini CLI 0.56.0, ground truth by `ls` on
# the target -- never the model's own narration -- three independent escapes
# went straight through an allowlisted prefix:
#
#   git status > FILE                      -> file written (Class A)
#   git diff --output=PATH HEAD            -> file written outside the workspace (Class B)
#   git fetch --upload-pack=PATH .         -> PATH EXECUTED as a local program (Class C)
#
# Class A is only ever downgraded ALLOW -> ASK_USER, and that downgrade is
# switched off entirely under --yolo (`shouldDowngradeForRedirection`, bundle
# chunk-MYCBWRZE.js); the redirect target is skipped from per-subcommand
# checking outright. `allowRedirection` is an allow-side rule field only --
# nothing in the 0.56.0 schema forbids redirection under --yolo.
#
# Classes B and C contain no shell metacharacter at all, are atomic, and are
# never decomposed. No `commandPrefix` refinement touches them: the prefix
# matched is exactly the intended one.
#
# A middle-ground design was built and live-tested during #412's Plan-First
# review -- a terminated `commandRegex` allow over a character class excluding
# `= > < ; & | $ ( ) \ "`, closing A/B by construction rather than by
# enumerating flags. It held for a full round, then was falsified: git's
# write/execute flags are space-separable (`--upload-pack <path>`, no `=`),
# and the flag VALUE is a bare filesystem path made of characters any workable
# allow-class must permit. No pattern over the command string separates a safe
# `git fetch` from `git fetch --upload-pack <script>` -- they differ only in a
# flag name, which is the completeness burden this file's default-deny shape
# exists to avoid. Do not reintroduce an allowlist here; it cannot be made to
# hold, and each attempt reads as protection that is not there.
#
# Whole-tool deny is the one property this engine has been proven to enforce
# live (harmonic-forge#326): the tool leaves the model's own tool list, so
# there is no argument surface left to reason about.
#
# COST, accepted deliberately (#412, operator decision 2026-08-28): this
# removes Lane 1's entire posting channel -- `mise run l1-post`,
# `mise run lane-comment`, `mise run gh-new-issue` -- along with read-only
# `git` and `gh api`. A Gemini Lane 1 session is analysis-only: it composes
# handoffs as text and the operator relays them. Interim, not permanent -- the
# replacement is an MCP posting surface taking structured parameters, where
# there is no shell string to attack. Restoring shell here is not the fix.
[[rule]]
toolName = "run_shell_command"
decision = "deny"
priority = 999
denyMessage = "harmonic-forge#412: Lane 1 has no shell. An argument-constrained allowlist here was live-verified NOT to hold -- redirection, `git diff --output`, and `git fetch --upload-pack` (arbitrary local code execution) all passed it. Compose the handoff as text; the operator relays it."

# Read/context tools -- no mutation risk, core review capability.
[[rule]]
toolName = [
  "read_file",
  "read_many_files",
  "list_directory",
  "glob",
  "grep_search",
  "google_web_search",
  "web_fetch",
  "enter_plan_mode",
  "update_topic",
]
decision = "allow"
priority = 999
