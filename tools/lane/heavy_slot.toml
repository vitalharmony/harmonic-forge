# harmonic-forge#1271: what each heavy kind reserves, and the admission limits.
# check and e2e are measured, and the numbers are posted to the issue. check-full, gate, kill
# and default are not: each is a starting value, and any measured run replaces it.

[limits]
recent_seconds = 120          # load lags a job's start by about this long
max_wait_seconds = 600        # the head of the queue starts after this, memory permitting
cpu_avg10 = 60.0              # PSI `some avg10` at or above this holds a job back
mem_avg10 = 10.0
poll_seconds = 10
note_seconds = 60

[kinds.check]  # measured: 573 s, p90 4.5 cores, peak 6.1, summed RSS 4.9 GB
cores = 5
gb = 6

[kinds.check-full]  # not measured; it runs all of check first, so never below check
cores = 5
gb = 8

[kinds.gate]
cores = 2
gb = 8

[kinds.e2e]  # measured: 106 s, p90 4.7 cores, summed RSS 4.8 GB
cores = 5
gb = 6

[kinds.kill]
cores = 2
gb = 4

[kinds.default]
cores = 2
gb = 4
