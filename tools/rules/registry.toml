# Rule registry — stable IDs for every enforceable rule (harmonic-forge#447)
#
# WHAT A ROW IS
#   One enforceable rule: a statement a session could violate. Narrative,
#   rationale and incident records are NOT rows — they attach to the rule
#   they justify. One source bullet may yield several rows; the unit is the
#   obligation, not the markup.
#
# FIELDS
#   id            R-NNNN, globally monotonic. Stable across relocation —
#                 that is the whole point, since the corpus trim this
#                 unblocks will move rules between files in bulk. The
#                 registry is its own allocator: `check_rule_drift.py
#                 --next-id`.
#   file, anchor  DESCRIPTIVE ONLY. Never key on them. Anchors are coarse
#                 (one heading can span ~15 bullets) and are not unique per
#                 rule. The paired `<!-- R-NNNN -->` marker in the source is
#                 the actual locator.
#   statement     One-line human paraphrase. Not the rule text, and not
#                 what drift is measured against.
#   text_sha      Hash over the annotated span, whitespace-normalised per
#                 line so a reflow is not drift but a word change is. This
#                 is what makes "violations of *this* rule since it was
#                 written" mean something.
#   hooks         [{script, events, wired_in}] — NOT a scalar `enforcement`
#                 field. Wiring is not uniform across checkouts, so "is this
#                 rule mechanized?" has no single answer and any scalar
#                 would be false in some scope.
#   restates      This rule restates another (AC4). The count of prose rules
#                 restating a hook-enforced one is what sizes the corpus trim.
#
# SCOPE: harmonic-forge `rules/*.md`. `3-lane-protocol.md` is the second
# annotation pass; HRSE2's half is a separate PR and must skip the three
# symlinked paths there, which resolve back into this repo.
# `.claude/skills/` is deliberately out of scope.

