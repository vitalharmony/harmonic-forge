anchor = "Pre-Flight Second Read"
statement = "pitch-inspection is one pass with no loop; disagreement after one revision escalates to the operator, never a second pre-flight round."
text_sha = "a51cf1d4215f814d"
hooks = []

[[rule]]
id = "R-0240"
file = "3-lane-protocol.md"
anchor = "Pre-Handoff Precondition Trace"
statement = "A handoff whose receiving action is a live/--apply/data-mutating command must carry a complete Pre-Flight Preconditions field; a blank or incomplete field is itself a pitch-inspection trigger."
text_sha = "8cde88a548af64ae"
hooks = []

[[rule]]
id = "R-0241"
file = "3-lane-protocol.md"
anchor = "Pre-Handoff Precondition Trace"
statement = "Lane 2 re-verifies each precondition itself rather than trusting Lane 1's field on faith, and reports a discrepancy rather than proceeding past one."
text_sha = "145144f5f4b64b05"
hooks = []

[[rule]]
id = "R-0242"
file = "3-lane-protocol.md"
anchor = "Long-Running Script Handoffs"
statement = "A handoff specifying a script making more than 50 sequential network calls must require incremental checkpointing and resume, a bounded-work control, and a network-free report mode; a handoff omitting any of them must not be posted."
text_sha = "f745ff5865c6a784"
hooks = []

[[rule]]
id = "R-0243"
file = "3-lane-protocol.md"
anchor = "Live-Verification Specs for Pre-Existing Services"
statement = "Before approving a Lane 3 test case that invokes a pre-existing service live, Lane 1 cites a measured duration budget, scopes the check when it exceeds a turn, asserts return shape rather than value-equality against live external data, and routes unbounded runs to a non-blocking deferred check."
text_sha = "c396c1d0d65bbea3"
hooks = []

[[rule]]
id = "R-0244"
file = "3-lane-protocol.md"
anchor = "Plan-First Implementation"
statement = "Plan-first is required when Delegated Judgment Calls is anything other than \"none\", the implementation mutates git state or live data, or HITL says \"Plan-first #N\"."
text_sha = "01f05fd8276ca4f5"
hooks = []

[[rule]]
id = "R-0245"
file = "3-lane-protocol.md"
anchor = "Plan-First Implementation"
statement = "For a plan-first issue Lane 1's handoff omits the Implementation Spec section entirely, so there is nothing for Lane 2 to implement from until the plan review passes."
text_sha = "3bd261c8dcce9690"
hooks = []

[[rule]]
id = "R-0246"
file = "3-lane-protocol.md"
anchor = "Plan-First Implementation"
statement = "On \"Plan #N\" Lane 2 posts its implementation plan covering each delegated judgment call and the failure/cleanup paths of any mutating mechanics, and stops."
text_sha = "0f0018e14027f076"
hooks = []

[[rule]]
id = "R-0247"
file = "3-lane-protocol.md"
anchor = "Plan-First Implementation"
statement = "Lane 1 invokes pitch-inspection in plan-review mode covering only the delta Lane 2 introduced, and posts the verdict as a single comment."
text_sha = "6456290a7bfe6b0c"
hooks = []

[[rule]]
id = "R-0248"
file = "3-lane-protocol.md"
anchor = "Plan-First Implementation"
statement = "A REFORGE verdict goes back to Lane 2 for one revised plan; a second REFORGE escalates to HITL, never a third review round."
text_sha = "0228f49af04715cb"
hooks = []

[[rule]]
id = "R-0249"
file = "3-lane-protocol.md"
anchor = "Plan-First Implementation"
statement = "A plan-first issue where Lane 2 starts implementing without a posted-and-reviewed plan is a protocol violation and must be filed, not merely noted in a gate comment."
text_sha = "64cb994b9a3b4b36"
hooks = []

[[rule]]
id = "R-0250"
file = "3-lane-protocol.md"
anchor = "GitHub Comment Formatting — Every Lane, Every Post"
statement = "Any lane posting a comment containing a code block writes the body to a file and posts via gh api -F body=@<path>, then fetches the comment back to confirm it rendered legibly."
text_sha = "e3b79a7b5f08845a"
hooks = [
  { script = "block_inline_prose.py", events = ["PreToolUse"], wired_in = ["harmonic-forge/.claude/settings.json", "HRSE2/.claude/settings.json"] },
]

