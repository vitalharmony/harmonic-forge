# --------------------------------------------------------------------------
# Outside commands (decision 4), fail-closed by family. For a program, the
# entries naming it are tried in order; `match` holds when `any_token` is any
# later token, or `adjacent` is a pair of adjacent tokens anywhere, or the
# named batch_auth recognizer matches. An entry with no `match` takes every
# other call of its programs. Inside a family a call is `read` only on its
# read shape; anything else takes the family's class. Every other outside
# command is ungated.

[[outside]]
family = "git push"
programs = ["git"]
match = {any_token = "push"}
class = "external-publish"
read_shape = "none"
guard_kind = "hook"
guard = "block_unchecked_push.py:118 (check_receipt.push_refusal), and check_receipt.py verify at pre-push (:203)"
guard_note = "refuses a Tooling Exception branch with no check receipt; other pushes pass"
replay_tool = "git-push"
validates = [
  {class = "receipt", cite = "tools/hooks/check_receipt.py:140"},
  {class = "receipt", cite = "tools/hooks/block_unchecked_push.py:118"},
]

[[outside]]
family = "gh pr merge"
programs = ["gh"]
match = {adjacent = ["pr", "merge"], recognizer = "classify_pr_merge"}
class = "irreversible"
read_shape = "none"
guard_kind = "hook"
guard = "batch_gate.py:50 (batch_auth.decide: allow on a live BATCH grant, else ask)"
replay_tool = "gh-pr-merge"
validates = [
  {class = "receipt", cite = "tools/hooks/batch_auth.py:1363-1417"},
  {class = "receipt", cite = "tools/hooks/batch_gate.py:50"},
]

[[outside]]
family = "gh issue close"
programs = ["gh"]
match = {adjacent = ["issue", "close"], recognizer = "classify_issue_close"}
class = "external-publish"
read_shape = "none"
guard_kind = "hook"
guard = "batch_gate.py:50 (batch_auth.decide asks on every close, batch_auth.py:1344-1353)"
replay_tool = "gh-issue-close"

[[outside]]
family = "gh"
programs = ["gh"]
class = "external-publish"
read_shape = "gh-permitted"
gap = "no guard on a gh write outside the named families"
guard_note = "read shape is deny_advisory_subagent_gh_writes._gh_permitted (:321)"
replay_tool = ["gh-api", "gh-pr-create", "gh-workflow-run", "gh-issue-list"]

[[outside]]
family = "curl, wget"
programs = ["curl", "wget"]
class = "external-publish"
read_shape = "flag-allowlist"
gap = "no guard on an HTTP write"
  [outside.flags.curl]
  no_value = ["-s", "--silent", "-S", "--show-error", "-f", "--fail", "-L", "--location", "-i", "--include", "-I", "--head", "-v", "--verbose", "--compressed"]
  with_value = ["-o", "--output", "-m", "--max-time", "--connect-timeout", "--retry", "-w", "--write-out"]
  [outside.flags.wget]
  no_value = ["-q", "--quiet", "-nv", "--no-verbose", "-S", "--server-response", "--spider"]
  with_value = ["-O", "--output-document", "--timeout", "--tries"]

[[outside]]
family = "podman, docker"
programs = ["podman", "docker"]
class = "shared-state"
read_shape = "first-token"
first_token = ["ps", "inspect", "logs", "images", "version"]
gap = "no guard on a container write"
