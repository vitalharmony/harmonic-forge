# Effect registry (harmonic-forge#1290).
#
# One [[tool]] per script under tools/gh and tools/lane, with one
# [[tool.mode]] per dispatch branch: its effect class, and for shared state or
# above its precheck, its guard, or the gap. One [[library]] per file that is
# only imported or sourced, the data files, and the [[outside]] command table
# (decision 4). `tools/registry/effects.py` loads and validates this file,
# renders tools/gh/_preflight.py's inventory table, the decision 6 gap list
# (`effects.py gaps`) and the replay layer set
# tools/precheck/layersets/registry-v1.json. A consuming repo extends it with
# `<repo>/.claude/effects.toml`, which may hold [[tool]] and [[library]]
# entries only.
#
# Classes, in decision 2's order: read, local-write, shared-state,
# external-publish, irreversible. A mode that does two things takes the higher.
#
# Local write versus shared state, in order (the handoff's rule): 1 scratch,
# temp or an --out that is not a committed or compared artifact: local write.
# 2 a cache whose authority is elsewhere and which a reader rederives when
# missing (remote-tracking refs from a fetch, gh-as's identity memo): local
# write. 3 a _preflight receipt only the same tool's own run reads in the same
# session: local write. 4 anything else that outlives the run (a grant,
# receipt, lock or admission record another reader acts on; refs this repo
# owns; a committed or compared artifact; a shared log): shared state.
#
# A mode below its tool's highest class is ever selected only by an exact
# form: `exact = true` and the call's arguments equal `match`. Every other
# call resolves to the tool's highest-class mode (decision 3); argv is never
# parsed in between. A non-exact mode's `match` documents its shape only. Every `cite` is `path:line` at the
# commit this file is part of.

data = [
  "tools/lane/baseline_launch_tuples.json",
  "tools/lane/cli_update.toml",
  "tools/lane/heavy_slot.toml",
  "tools/lane/lane3_safety_additions.txt",
  "tools/lane/lane_hooks.json",
  "tools/lane/policies/claude-lane3.json",
  "tools/lane/systemd/forge-cli-update.service",
  "tools/lane/systemd/forge-cli-update.timer",
  "tools/lane/systemd/forge-orphan-reap.service",
  "tools/lane/systemd/forge-orphan-reap.timer",
]

