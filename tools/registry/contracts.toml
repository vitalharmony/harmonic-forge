# The contract index (harmonic-forge#1501): one [[contract]] per shared behavior.
#
# Fields (the shared field list every repo's index follows):
#   id              <project>.<name>, unique; <project> is a name in projects.toml
#   scope           one sentence
#   owner           owning repo path and public symbols
#   modules         the module set the contract composes
#   authority       the authoritative source (data or code)
#   example_caller  one real caller, path:line
#   guard           guard and test references
#   exceptions      where named exceptions live, or "none"
#   scan_roots      what its guard scans
#   blind_spots     what the guard cannot see
#   status          canonical | pending-adopter
#
# `tools/registry/contracts.py validate` checks the schema and that every path
# resolves; `render` writes docs/CONTRACTS.md; `--check` is the freshness check
# that `mise run ci-check` runs. The effect registry (effects.toml) is linked,
# never duplicated.

[[contract]]
id = "harmonic-forge.gh-argv-parser"
scope = "The pflag-faithful parse and decision of one gh close, merge or api call, against a pinned flag table."
owner = "tools/hooks/gh_argv.py: parse, decide, GATED_ROOTS, ArgvError"
modules = ["tools/hooks/gh_argv.py", "tools/hooks/gh_flag_table.json", "tools/hooks/gen_gh_flag_table.py"]
authority = "tools/hooks/gh_flag_table.json"
example_caller = "tools/hooks/close_gate.py:90"
guard = ["tools/hooks/test_gh_argv.py", "tools/rules/test_check_gh_recognizers.py"]
exceptions = "tools/rules/gh_recognizer_exceptions.toml (shrink-only, ceiling-pinned)"
scan_roots = ["tools/hooks"]
blind_spots = "text hooks tokenize a command string with shell_parse, which this contract does not cover; the index checks that example_caller's line exists, not that it still holds a call; check_gh_recognizers.py (harmonic-forge#1500) is a tripwire for accidental reintroduction of the shapes in TC1, TC2 and TC8, not a semantic proof, and every other shape is a blind spot, including: whitespace forms other than TEXT's, f-string and concatenated literals, operands built by splitting or joining, getattr/eval lookups, qualified (import a.b.mod; a.b.mod.s) and relative (from . import mod) re-exports, and a close/merge comparison in a symbol that never compares the paired noun (issue/pr); target grammar (URL and bare-number fallbacks, block_undetermined_phase_close.py:216-235) is not kind recognition and is not scanned; dynamic module loads are counted but not followed; a re-export through getattr(X, \"s\") with a constant name is not resolved by G4; only tools/hooks is scanned (tools/registry/effects.py is outside it)"
status = "canonical"
