# harmonic-forge's own service-lifecycle-adjacent tooling (harmonic-forge#54).
#
# This is the docs/tooling-repo SUBSET of the golden-path pattern
# (templates/golden-path/mise.toml) — check + commit + gh tasks only.
# Deliberately NOT included, by design, not oversight:
#   - bump: no running artifact exists to stamp. Consumers get this repo
#     via `sync_rules.py --pull`, so the git SHA already IS the version —
#     a per-commit VERSION file would gate nothing the SHA doesn't.
#   - restart: no service exists. This is a docs/rules/tooling repo.
# harmonic-forge.md's "Draft v0.2" header is a hand-maintained spec-status
# marker, bumped deliberately at real milestones — not automated here,
# on purpose (automating it per-commit would destroy its meaning).
#
# Transaction-log rotation has no version bump to hang it on, so it's tied
# to `commit --push` instead: push is this repo's genuine "publish" event
# (per the local-commits-until-push policy), the structural analog of
# HRSE2's version bump. See scripts/git_commit.py for the implementation.

[tools]
python = "3.13.13"

[env]
GH_REPO = "vitalharmony/harmonic-forge"
GH_PROJECT_OWNER = "vitalharmony"
GH_PROJECT_NUMBER = "3"

[tasks.test]
description = "Run every test under tools/ (harmonic-forge#293). Dependency-free — stdlib unittest, no install step."
run = "python3 tools/run_tests.py"

[tasks.check]
description = "Verification gate — syntax check over tools/ and sync_rules.py, then the full test suite"
run = """
set -e
find tools -name '*.py' -print0 | xargs -0 -n1 python3 -m py_compile
python3 -m py_compile sync_rules.py
echo "[CHECK] Syntax-clean: tools/*.py, sync_rules.py"
# harmonic-forge#293: this task's description used to end "(no test suite
# exists yet)" while 336 passing tests sat in the repo unrun. Running them
# here means `mise run check` means what a reader assumes it means.
python3 tools/run_tests.py
# harmonic-forge#454: cross-registry ID collision sweep. Prints SKIPPED (not
# "clean") in a single-repo checkout, so a no-op is distinguishable from a
# pass. NOTE: forge CI does not run this — harmonic-forge is public and hrse
# is private, so CI has no credential to check out the sibling. That is a
# stated, accepted gap, not missing wiring.
python3 tools/rules/check_cross_registry.py
# harmonic-forge#494: memory-store lint. Gated against the frozen CLEAN fixture,
# never the live store — the live store is grown by the harness, not by any
# branch, so a live-pinned exit-1 check is one no commit could turn green.
# harmonic-forge#500: `--today` is PINNED for every fixture run. Without it the
# fixtures' absolute `first_seen:` dates cross the 14-day threshold on a future
# calendar day and turn this gate red with no code change — a time bomb whose
# expiry is invisible in the diff that plants it.
python3 tools/memory/memory_lint.py --store tools/memory/testdata/clean --gate --today 2026-09-06
# `clean` proves Check 8 stays silent on a healthy store; `aging` proves it
# actually fires — a gate that only ever runs against green data cannot tell you
# it still works. Exit code pinned to exactly 1: `run()` returns 2 for a MISSING
# store, so a bare non-zero test would pass if the fixture were deleted, while
# the comment above still claimed the check was proven.
# `|| rc=$?` is required: this block runs under `errexit`, so an unguarded
# non-zero exit aborts the task before the assertion can read it.
rc=0; python3 tools/memory/memory_lint.py --store tools/memory/testdata/aging --gate --today 2026-09-06 >/dev/null || rc=$?
test "$rc" -eq 1 || { echo "memory_lint: the aging fixture must FAIL with exit 1 under --gate (got $rc)"; exit 1; }
"""

[tasks.context-budget]
description = "Measure a repo's always-loaded context surface — user + project CLAUDE.md and their @-imports, unscoped .claude/rules/, the memory index (harmonic-forge#497). Measured, not assumed: .windsurfrules is NOT counted (the harness does not inject it) and `globs:` does NOT scope a rule file (those ARE injected at start). Only appliesTo:/paths:/scope: suppress injection. Report-only unless --gate. Token figures are bytes/4 estimates and must never be quoted as counts."
usage = '''
flag "--repo <repo>" help="Measure this repo's surface (default: cwd)."
flag "--budget <budget>" help="Byte ceiling (default 60000)."
flag "--gate" help="Exit 1 when over budget. Without it the run is report-only and exits 0."
flag "--summary" help="One line instead of the table."
flag "--json" help="Machine-readable rows."
'''
run = """
python3 tools/memory/context_budget.py \
  ${usage_repo:+--repo "$usage_repo"} \
  ${usage_budget:+--budget "$usage_budget"} \
  ${usage_gate:+--gate} \
  ${usage_summary:+--summary} \
  ${usage_json:+--json}
"""

[tasks.forge-onboard]
description = "Bring a repo under the 3-lane protocol, or verify one already is (harmonic-forge#498). Reads projects.toml, the single manifest that gh_issue.py and repo_hygiene.py now share instead of each keeping a copy of the board map. VERIFY IS THE DEFAULT -- --apply writes. Exit 0 all green, 1 a check failed, 2 the run could not happen (bad manifest, unknown project), so a gate can tell a finding from its own misconfiguration."
usage = '''
flag "--project <project>" help="Manifest `name` to act on (default: every entry)."
flag "--apply" help="Create what is missing. Without it the run only verifies."
flag "--dry-run" help="With --apply: print what would change, change nothing."
flag "--manifest <manifest>" help="Alternate projects.toml."
'''
run = """
python3 tools/onboard/forge_onboard.py \\
  ${usage_project:+--project "$usage_project"} \\
  ${usage_apply:+--apply} \\
  ${usage_dry_run:+--dry-run} \\
  ${usage_manifest:+--manifest "$usage_manifest"}
"""

[tasks.memory-triage]
description = "Classify every feedback memory against the rule registries and emit promotion dispositions (harmonic-forge#495). Read-only on the store, both repos and GitHub — it proposes, never edits or files. DUP/LOCAL/STATE are decided mechanically from frontmatter; FOLD rows carry RANKED rule candidates, not a verdict, because no similarity cutoff separates 'already a rule' from 'about the same subject' in a 261-rule single-protocol corpus. The judgment layer is skills/memory-triage/SKILL.md."
usage = '''
flag "--store <store>" help="Memory store to classify (default: the configured shared store)."
flag "--repo-root <repo_root>" help="Repo to read rules from. Repeatable. Default: both."
flag "--json" help="Machine-readable rows."
flag "--counts" help="Only the class counts."
'''
run = """
python3 tools/memory/memory_triage.py \\
  ${usage_store:+--store "$usage_store"} \\
  ${usage_repo_root:+--repo-root "$usage_repo_root"} \\
  ${usage_json:+--json} \\
  ${usage_counts:+--counts}"""

[tasks.memory-backfill]
description = "Backfill first_seen/instances into feedback memories (harmonic-forge#500). Dry-run by default; --apply writes. Idempotent, never overwrites an existing field."
usage = '''
flag "--apply" help="Write the fields. Without it the run reports and touches nothing."
flag "--store <store>" help="Backfill this store instead of the resolved one."
'''
run = """
python3 tools/memory/backfill_frontmatter.py ${usage_apply:+--apply} ${usage_store:+--store "$usage_store"}
"""

[tasks.commit]
description = "Stage, append a transaction-log entry, and commit — in that order, one commit total"
usage = '''
flag "--message <message>" help="Override the auto-generated commit message"
flag "--push" help="Push to remote (also clears transaction-log.md, main only — see script header)"
'''
run = """
set -e
set --
[ -n "${usage_message:-}" ] && set -- "$@" "--message=${usage_message}"
[ "${usage_push:-false}" = "true" ] && set -- "$@" "--push"
python3 scripts/git_commit.py "$@"
"""

[tasks.gh-new-issue]
description = "Create a GitHub issue and add it to the harmonic-forge Backlog board (tools/gh/gh_issue.py). Prefer --body-file over --body; set --tier at filing time."
usage = '''
flag "--title <title>" help="Issue title" required=#true
flag "--body <body>" help="Issue body as a string. Prefer --body-file: prose passed as a shell argument is corrupted by backticks, printf specifiers, and dropped apostrophes (harmonic-forge#266)."
flag "--body-file <path>" help="Read the issue body from a file. PREFERRED over --body."
flag "--labels <labels>" help="Comma-separated labels" default="feature"
flag "--tier <tier>" help="Board Tier field: fast | standard | deep. The model-routing signal (harmonic-forge#257) - set it at filing time."
flag "--theme <theme>" help="Board Theme field (hrse#966) - what capability this issue is about. Required on every open issue; options are read live from the board."
flag "--venture <venture>" help="Board Venture field (hrse#966) - whose work this is. Required on every open issue; options are read live from the board."
'''
run = """
set -e
# harmonic-forge#316: --body-file, --tier, --theme, --venture were all
# absent here -- the same drift class harmonic-forge#290 filed for hrse's
# wrapper (hrse#883), just unfixed on the repo that owns the parity check.
# --milestone deliberately stays off: harmonic-forge has none by decision
# (harmonic-forge#283) and wrapper-parity's --allow-missing covers it.
if [ -n "$usage_body" ] && [ -n "$usage_body_file" ]; then
  echo "gh-new-issue: pass --body or --body-file, not both." >&2
  exit 2
fi
if [ -z "$usage_body" ] && [ -z "$usage_body_file" ]; then
  usage_body="*Created via mise gh-new-issue*"
fi
python3 tools/gh/gh_issue.py \
  --repo "$GH_REPO" \
  --title "$usage_title" \
  --labels "$usage_labels" \
  ${usage_body_file:+--body-file "$usage_body_file"} \
  ${usage_body:+--body "$usage_body"} \
  ${usage_tier:+--tier "$usage_tier"} \
  ${usage_theme:+--theme "$usage_theme"} \
  ${usage_venture:+--venture "$usage_venture"}
"""

[tasks.post-comment]
description = "Post a GitHub issue comment via --body-file with a mandatory self-check (tools/gh/post_comment.py, ADR-004/ADR-005)"
usage = '''
flag "--issue <issue>" help="Issue number" required=#true
flag "--file <file>" help="Path to a file containing the comment body" required=#true
'''
run = "python3 tools/gh/post_comment.py --repo \"$GH_REPO\" --issue \"$usage_issue\" --file \"$usage_file\""

[tasks.l2-run]
description = "Run a command under a Lane 2 issue's receipt scope (tools/gh/receipt_runner.py, harmonic-forge#371). Records argv/exit-code/output-digest; locks the issue on a non-zero exit."
usage = '''
flag "--issue <issue>" help="Issue number" required=#true
arg "command" var=#true help="the command to run, after a literal '--'"
'''
run = "python3 tools/gh/receipt_runner.py --issue \"$usage_issue\" -- $usage_command"

[tasks.l2-post]
description = "Post a receipt-backed Lane 2 status comment, with a mandatory post/fetch/diff self-check (tools/gh/l2_post.py, harmonic-forge#371). The only sanctioned raw-GitHub-post transport under LANE=2 -- see tools/hooks/block_lane2_status_claims.py."
usage = '''
flag "--kind <kind>" help="plan | completion | blocked" required=#true
flag "--issue <issue>" help="Issue number" required=#true
flag "--narrative-file <file>" help="Path to a file containing the narrative section" required=#true
flag "--receipts <receipts>" help="Space-separated receipt JSON paths" var=#true
flag "--status <status>" help="Lead block: where the issue now stands (required for completion/blocked, harmonic-forge#472)"
flag "--change <change>" help="Lead block: what changed, or what blocks"
flag "--next <next>" help="Lead block: the literal next action"
'''
run = "python3 tools/gh/l2_post.py post --kind \"$usage_kind\" --repo \"$GH_REPO\" --issue \"$usage_issue\" --narrative-file \"$usage_narrative_file\" --receipts $usage_receipts --status \"$usage_status\" --change \"$usage_change\" --next \"$usage_next\""

[tasks.l2-snapshot]
description = "Fetch and record a fresh comment snapshot for an issue (tools/gh/l2_post.py snapshot, harmonic-forge#371) -- the only source a Lane 2 'no new comment exists' claim may be sourced from (AC3)."
usage = '''
flag "--issue <issue>" help="Issue number" required=#true
'''
run = "python3 tools/gh/l2_post.py snapshot --repo \"$GH_REPO\" --issue \"$usage_issue\""

[tasks.l2-resolve-lock]
description = "Clear a Lane 2 issue-scoped failure lock (tools/gh/l2_post.py resolve-lock, harmonic-forge#371). Refuses unless --resolution-comment names a real, fetchable comment."
usage = '''
flag "--issue <issue>" help="Issue number" required=#true
flag "--resolution-comment <id>" help="Comment id that resolves the lock" required=#true
'''
run = "python3 tools/gh/l2_post.py resolve-lock --repo \"$GH_REPO\" --issue \"$usage_issue\" --resolution-comment \"$usage_resolution_comment\""

[tasks.wrapper-parity]
description = "Assert every mise wrapper over tools/gh/ exposes its script's full flag surface (harmonic-forge#290/#316). The meta-finding #316 exists to fix: this checker lived only in the repo it never ran against."
run = """
set -e
PARITY=tools/gh/wrapper_parity.py
# Intentional omissions are declared per wrapper, so an *undeclared* gap is
# the failure. --repo is supplied from $GH_REPO by every wrapper here;
# --milestone is off by decision (harmonic-forge#283, no milestones here).
python3 $PARITY --task gh-new-issue \
  --mise-toml mise.toml \
  --script tools/gh/gh_issue.py \
  --allow-missing "repo,project-owner,project-number,milestone,estimate"
# post-comment deliberately exposes only --file: passing a comment body as a
# shell argument is the corruption harmonic-forge#266 exists to prevent.
python3 $PARITY --task post-comment \
  --mise-toml mise.toml \
  --script tools/gh/post_comment.py \
  --allow-missing "repo,body"
"""

[tasks.lane3-begin]
description = "Lane 3: mark this worktree as actively filling Lane 3, unlocking gate-checkout for the next 12 hours (harmonic-forge#138). Run once per Lane 3 session, from the worktree you're gating in, before using it."
run = '''
git_dir="$(git rev-parse --absolute-git-dir)"
touch "$git_dir/LANE3_ACTIVE"
echo "lane3-begin: $(pwd) marked Lane 3-active"
'''

[tasks.lane3-end]
description = "Lane 3: clear the LANE3_ACTIVE marker set by lane3-begin (harmonic-forge#433). This is hrse#884 unfixed in this repo — the marker was write-only here, so a finished worktree read as Lane 3-active forever and had to be cleared by hand. No scheduler-lease release: unlike hrse, this repo has no backend and no lease."
run = '''
set -e
git_dir="$(git rev-parse --absolute-git-dir)"
rm -f "$git_dir/LANE3_ACTIVE"
echo "lane3-end: $(pwd) cleared"
'''

[tasks.gate-checkout]
description = "Lane 3: switch to a branch without discarding uncommitted work. Refuses pathspec forms and dirty trees. Refuses if a live process (dev server, running test) has its cwd inside this worktree — a second actor's checkout would otherwise silently yank state out from under it, no lock or error (harmonic-forge#137, real incident hrse#439: a concurrent checkout in HRSE2-lane3 disrupted an in-progress Lane 3 gate). Fetches first; falls back to a detached checkout if the branch is already checked out in a sibling worktree (real incident, hrse#335: harmonic-forge#29/#30 both blocked because the reviewed branch was already checked out in the lane2 worktree)."
usage = '''
arg "<branch>" help="Branch name to check out"
'''
run = '''
set -e
branch="$usage_branch"

if [ -z "$branch" ]; then
  echo "gate-checkout: branch name is required" >&2
  exit 1
fi

case "$branch" in
  -*|.|..|/*|*[[:space:]]*)
    echo "gate-checkout: invalid branch name '$branch'" >&2
    exit 1
    ;;
esac

if [ -n "$(git status --porcelain)" ]; then
  echo "gate-checkout: refusing to switch branches with a dirty working tree" >&2
  exit 1
fi

python3 tools/worktree/check_worktree_busy.py "$(pwd)" || exit 1

git fetch origin "$branch" --quiet || {
  echo "gate-checkout: could not fetch '$branch' from origin" >&2
  exit 1
}

if git checkout "$branch" 2>/tmp/gate-checkout-err.$$; then
  rm -f /tmp/gate-checkout-err.$$
  exit 0
fi

if grep -q "already used by worktree" /tmp/gate-checkout-err.$$; then
  echo "gate-checkout: '$branch' is checked out in a sibling worktree — falling back to a detached checkout of the same commit" >&2
  rm -f /tmp/gate-checkout-err.$$
  git checkout --detach "origin/$branch"
else
  cat /tmp/gate-checkout-err.$$ >&2
  rm -f /tmp/gate-checkout-err.$$
  exit 1
fi
'''
