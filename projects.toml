runs_lane3 = true
# needs_gate_adapter = false (harmonic-forge#730 DJC 2): no graph, database
# or live app service of its own -- its own lane3-end says it plainly:
# "unlike hrse, this repo has no backend and no lease".
needs_gate_adapter = false

