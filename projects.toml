runs_lane3 = true
# needs_gate_adapter = false (harmonic-forge#730 DJC 2): a prototyping
# ground with no graph, database or live service; its Lane 3 scope is static
# checks.
needs_gate_adapter = false

# ke'nekted is one venture across three repos, on one board and one account. An entry is one
# repo (a `repo`, a checkout, worktrees) and prefixes are per repo (harmonic-forge#806).
[[project]]
name = "kenekted"
repo = "kenekted/kenekted-platform"
path = "~/Harmonic_Projects/kenekted/kenekted-platform"
prefix = "K"
workspace = "kenekted"
account = "harmonicarchitect"
board_owner = "harmonicarchitect"
# The Kenekted Kanban (board #1) is the team's board and holds every kenekted repo. Its
# fields Tier, Theme and Venture were ADDED (harmonic-forge#806); Status was left alone.
board_number = "1"
milestones = false
onboarded = true
token_exception = "the board (harmonicarchitect #1, the Kenekted Kanban) is a USER-owned Projects v2 board, which fine-grained PATs cannot access (GitHub-documented; verified 403, harmonic-forge#805). A fine-grained PAT for the account was issued and tested, then deleted (operator, 2026-09-29). Revisit if the board moves to the kenekted organization."

[project.protocol]
worktree_name = "{checkout}-lane{lane}"
l1_post_task = "l1-post"
lane_comment_task = "lane-comment"
gate_checkout_task = "gate-checkout"
lane3_begin_task = "lane3-begin"
lane3_end_task = "lane3-end"
gate_task = "ci-check"
runs_lane3 = true
# needs_gate_adapter = false (harmonic-forge#806): DEFERRED, not declined: this Laravel app owns a database and live service, so a gate adapter
# is owed. It has no `ci-check` yet either; both belong to the kenekted-platform CI child
# (harmonic-forge#806 step 8), and `verify` stays red-by-design until then.
needs_gate_adapter = false

