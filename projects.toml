# The onboarded-repo manifest (harmonic-forge#498).
#
# One fact, one home. Bringing a repo under the 3-lane protocol used to mean
# editing five places that each kept their own copy of the same list:
# `gh_issue.py`'s REPO_BOARDS, `repo_hygiene.py`'s `_REPO_BOARDS` (a verbatim
# duplicate, with a comment saying so), `rules/lane-shorthand.md`'s prefix
# table, the sweep's default repo list, and the per-lane worktree procedure in
# `3-lane-protocol.md`. Duplication is the only source of drift, and drift here
# is silent: a repo missing from one copy still files issues, just onto the
# wrong board.
#
# ## Fields
#
# repo            GitHub `owner/name`. Absent for a projected repo that does
#                 not exist yet -- those are listed so their prefix letter is
#                 reserved, not so they can be operated on.
# path            Local checkout, `~`-relative. Absent when not checked out.
# worktree_dir    Where `<name>-lane2/` and `<name>-lane3/` live. Defaults to the
#                 checkout's PARENT, which is right for every repo except
#                 harmonic-forge: its checkout is `~/harmonic-forge` while its
#                 lane worktrees are in `~/Harmonic_Projects/`. That is not
#                 derivable from the checkout path, which is exactly why it is a
#                 manifest field -- the first version of this tool inferred it
#                 and reported two worktrees missing that exist.
# prefix          Single-letter lane shorthand (`H26` -> hrse#26). Must be
#                 unique across every entry, including projected ones.
# account         The GitHub account whose credentials reach it. NOT always
#                 `vitalharmony` -- ke'nekted is a separate account with
#                 separate credentials, and a vitalharmony-authed query against
#                 it returns EMPTY rather than erroring, so treating empty as
#                 absent is a real hazard here.
# board_owner     Projects v2 board owner, or absent when the repo has no board.
# board_number    Board number. A board is per VENTURE, not per repo:
#                 cymagraph-infra shares hrse's board #1 because the two repos
#                 ship one CymaGraph release together. openclaw-projects moved
#                 OFF #1 to its own #4 (2026-09-10) -- it is a prototyping
#                 ground that feeds the products and belongs to none of them,
#                 so it is its own venture, not CymaGraph work.
# milestones      Whether the repo carries release milestones. `false` for
#                 harmonic-forge is a DECISION, not a gap: its work is pulled by
#                 several ventures and belongs to no single release. See
#                 hrse docs/ROADMAP.md. Do not "fix" it.
# active_milestones  The operator's live releases (harmonic-forge#952): the lane
#                 queue skips an issue whose milestone is set and not listed; an
#                 issue with no milestone is never skipped. Explicit on purpose:
#                 the 2026-09-14 ruling removed an inferred "future milestone"
#                 exclusion because it dropped the lane's real queue. Absent
#                 means no filtering. Only valid where `milestones = true`.
# token_exception Why this account's slot may hold a token that is NOT a fine-grained PAT
#                 (harmonic-forge#805). Lane credentials are fine-grained PATs; the one
#                 exception on record is an account whose boards are USER-owned Projects v2,
#                 which a fine-grained PAT cannot read or write (GitHub-documented; verified
#                 403). Absent means "no exception": `forge-onboard` FAILs a slot holding an
#                 OAuth or classic token. An empty reason counts as absent.
# workspace       The lane workspace this repo is worked from (harmonic-forge#917):
#                 `vh`, `leasepal` or `kenekted`. Required on every onboarded
#                 project. A belt arms with `--workspace <name>` resolved from its
#                 session's checkout, so three workspaces' Lane 2 sessions never
#                 pick up the same issue. Not the account (LeasePAL is on
#                 vitalharmony) and not the board (harmonic-forge has its own
#                 board but is worked from `vh`).
# onboarded       Whether the 3-lane apparatus is installed. A projected repo is
#                 false; a real repo that is false is a backlog item.
# protocol        Repo-specific scalar inputs to the portable lane procedure.
#   worktree_name       Basename shape under `worktree_dir`; `{checkout}` and
#                       `{lane}` are the only placeholders. This cannot be
#                       derived because HRSE2's checkout basename differs from
#                       its manifest name and repos may choose another shape.
#   l1_post_task        Mise task used for Lane 1 protocol artifacts.
#   lane_comment_task   Mise task used for ordinary Lane 1 discussion.
#   gate_checkout_task  Mise task that prepares Lane 3's target checkout.
#   lane3_begin_task    Mise task that records the Lane 3 session boundary.
#   lane3_end_task      Mise task that clears it. Declared separately rather
#                       than derived from lane3_begin_task: a repo may name it
#                       anything, and a session boundary with no declared close
#                       is how a worktree reads as Lane 3-active forever
#                       (harmonic-forge#730).
#   gate_task           The mise task a lane runs as its gate before handing off
#                       (harmonic-forge#918): `check` for hrse, harmonic-forge and
#                       cymagraph-infra; `ci-check` where CI runs exactly that.
#                       `tools/lane/ci_plan.py` expands it into the step list.
#   runs_lane3          Whether the repo owns a Lane 3 worktree at all. This is
#                       a declared capability, not inferred from today's disk.
#   needs_gate_adapter  Optional. A `runs_lane3` repo either ships
#                       `.claude/gate-adapter.json` or sets this to `false`
#                       with a stated reason. Absent means NEITHER, which
#                       fails the check: an absent manifest with no
#                       declaration is indistinguishable from an oversight,
#                       and silence is what harmonic-forge#730 exists to
#                       outlaw. Omit it entirely for a repo that ships a real
#                       manifest (hrse).
#   ci_parity_task      Optional (harmonic-forge#802). A repo's CI standard is
#                       `verify` -> `mise run ci-check`; a repo whose CI
#                       instead mirrors `check`'s commands against its own
#                       parity tool (hrse's `ci-parity-check-command-sets`)
#                       declares that task name here, and `check_ci` treats
#                       it as this repo's own equivalent of `ci-check` rather
#                       than flagging a missing one. Absent means the repo
#                       follows the default `ci-check` convention.
#
# ## The lane task layer (harmonic-forge#730)
#
# The five tasks named above are the UNIVERSAL minimum, required of every
# onboarded repo whatever its shape. `gate-restart`, `gate-e2e` and
# `check-worktree-busy` are CONDITIONAL -- they restart and exercise a live
# running service, so a repo without one does not need them. hrse has them;
# harmonic-forge, cymagraph-infra and openclaw-projects do not, and that is
# correct rather than a gap.
#
# cymagraph-infra deliberately does NOT clone them (DJC 1). Its nearest
# equivalents -- `environment-up`, `spin-up`, `tofu-apply` -- provision real
# cloud infrastructure, which costs money and mutates shared state; a gate that
# spins real infra breaks the rule that a gate never mutates state it did not
# create. Its gate-appropriate exercise surface already exists and is
# read/validate shaped: `test`, `validate-tenants`, `test-control-plane`,
# `verify-restore`.

[[project]]
name = "hrse"
repo = "vitalharmony/hrse"
path = "~/Harmonic_Projects/HRSE2"
prefix = "H"
workspace = "vh"
account = "vitalharmony"
board_owner = "vitalharmony"
board_number = "1"
milestones = true
active_milestones = ["3.0"]
onboarded = true
token_exception = "fine-grained PATs cannot access user-owned Projects v2 (GitHub-documented limitation; verified 403 in harmonic-forge#805 issuecomment-5883764727). Revisit if the boards move to an organization."

[project.protocol]
worktree_name = "{checkout}-lane{lane}"
l1_post_task = "l1-post"
lane_comment_task = "lane-comment"
gate_checkout_task = "gate-checkout"
lane3_begin_task = "lane3-begin"
lane3_end_task = "lane3-end"
gate_task = "check"
runs_lane3 = true
# harmonic-forge#802: hrse's CI mirrors `check`'s commands against its own
# drift-detection tool rather than declaring a `ci-check` task; this is the
# declared exception `check_ci` treats as equivalent, not a missing task.
ci_parity_task = "ci-parity-check-command-sets"
# harmonic-forge#875: HRSE2's gate worktree owns its backend/.env (the
# disposable-graph file harmonic-forge#861 introduced), so `lane3` runs this
# narrow task at launch instead of relinking it to the main checkout's.
lane3_env_task = "lane3-env-provision"

