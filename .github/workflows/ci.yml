# harmonic-forge#293 — this repo's first CI workflow.
#
# 336 tests existed here and nothing ran them. tools/hooks/ is the
# lane-governance layer (block_lane1_status_claims, model_tier_gate,
# lane3_cloud_cli_policy, deny_lane3_ae_self_post): a regression there does
# not fail loudly, it quietly stops enforcing something.
#
# harmonic-forge#802: `verify` runs `mise run ci-check`, the single
# CI-runnable definition, never a mirrored list of commands — that drift
# is exactly what turned hrse's `main` red three times (hrse#972/#2010).
# `ci-check` is the CI-runnable SUBSET of `mise run check`; `check` itself
# also runs machine-local steps (platform-link drift, the cross-registry
# sweep, the context-budget ratchet) that a fresh runner cannot pass.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4

      - run: mise run ci-check
